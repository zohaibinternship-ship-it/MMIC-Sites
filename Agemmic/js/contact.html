<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — AGEMMIC</title>
  <meta name="description" content="Get in touch with AGEMMIC — AmanorX Holdings’ agriculture evaluation, management, marketing and investment company." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <canvas id="organic-canvas" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="container contact">

    <nav class="top-nav" aria-label="Site navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

    <div class="logo" aria-label="AGEMMIC">AGEMMIC</div>

    <h1 class="page-title">Get in <span class="accent">Touch</span></h1>
    <p class="page-subtitle">Grow your solutions with us</p>

    <form id="contact-form" class="contact-form" novalidate>
      <div>
        <label for="cf-name">Name</label>
        <input type="text" id="cf-name" name="name" placeholder="Your name" required />
      </div>
      <div>
        <label for="cf-email">Email</label>
        <input type="email" id="cf-email" name="email" placeholder="your@email.com" required />
      </div>
      <div>
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" placeholder="How can we cooperate?" required></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>

    <a href="index.html" class="back-link">← Back to Home</a>

    <footer class="footer">
      © 2026 AGEMMIC — an AmanorX Holdings company. All rights reserved.
      <span class="separator">·</span>
      <a href="#">Privacy Policy</a>
      <span class="separator">·</span>
      <a href="#">Terms of Service</a>
    </footer>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
