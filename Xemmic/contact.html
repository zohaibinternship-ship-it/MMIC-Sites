<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — XEMMIC Exploration</title>
  <meta name="description" content="Get in touch with XEMMIC — AmanorX Holdings' mineral and metals exploration company. Inquiries, partnerships, and investment opportunities welcome.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

  <div id="scene-container"></div>
  <div class="ov-vignette"></div>
  <div class="ov-grain"></div>
  <div class="ov-strata"></div>

  <nav class="top-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>

  <main class="content content-page">
    <a href="index.html" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back
    </a>

    <h1 class="page-title">Get in <span class="accent">touch</span></h1>
    <p class="page-subtitle">We'd like to hear from you.</p>

    <form class="contact-form" id="contact-form" action="YOUR_GOOGLE_SHEET_URL_HERE" method="POST">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Your full name" required>

      <label>Email Address</label>
      <input type="email" name="email" placeholder="your@email.com" required>

      <label>Organization</label>
      <input type="text" name="organization" placeholder="Company or organization name">

      <label>Subject</label>
      <select name="subject" required>
        <option value="" disabled selected>Select a subject</option>
        <option value="general">General Inquiry</option>
        <option value="investment">Investment Opportunities</option>
        <option value="partnership">Partnership</option>
        <option value="media">Media & Press</option>
      </select>

      <label>Message</label>
      <textarea name="message" placeholder="Tell us how we can help..." rows="6" required></textarea>

      <button type="submit">Send Message</button>
    </form>

    <div class="form-success" id="form-success" style="display:none;">
      Message received. We'll respond within 24 hours.
    </div>
  </main>

  <footer class="footer">
    <span>&copy; 2026 XEMMIC &mdash; an AmanorX Holdings company. All rights reserved.</span>
    <span class="footer-sep">&middot;</span>
    <a href="#">Privacy Policy</a>
    <span class="footer-sep">&middot;</span>
    <a href="#">Terms of Service</a>
  </footer>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
