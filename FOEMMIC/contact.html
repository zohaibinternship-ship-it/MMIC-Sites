<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — FOEMMIC</title>
  <meta name="description" content="Get in touch with FOEMMIC — AmanorX Holdings’ food evaluation, management, marketing and investment company." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <canvas id="food-canvas" aria-hidden="true"></canvas>
  <div class="warm-gradient" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="container contact">

    <nav class="top-nav" aria-label="Site navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

    <div class="logo" aria-label="FOEMMIC">FOEMMIC</div>

    <h1 class="page-title">Get in <span class="accent">Touch</span></h1>
    <p class="page-subtitle">Let’s set the table together</p>

    <form id="contact-form" class="contact-form" action="PASTE_YOUR_WEB_APP_URL_HERE" method="POST" novalidate>
      <div>
        <label for="cf-name">Name</label>
        <input type="text" id="cf-name" name="Name" placeholder="Your name" required />
      </div>
      <div>
        <label for="cf-email">Email</label>
        <input type="email" id="cf-email" name="Email" placeholder="your@email.com" required />
      </div>
      <div>
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="Message" placeholder="How can we cooperate?" required></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>

    <a href="index.html" class="back-link">← Back to Home</a>

    <footer class="footer">
      © 2026 FOEMMIC — an AmanorX Holdings company. All rights reserved.
      <span class="separator">·</span><a href="#">Privacy Policy</a>
      <span class="separator">·</span><a href="#">Terms of Service</a>
    </footer>

  </div>

  <script src="js/main.js"></script>
  <script>
    const form = document.getElementById('contact-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault(); // stay on the page

      const btn = form.querySelector('button[type="submit"]');
      const original = btn.textContent;
      btn.textContent = 'SENDING...';
      btn.disabled = true;

      fetch(form.action, {
        method: 'POST',
        body: new FormData(form)
      })
      .then(res => {
        alert('Message sent successfully!');
        form.reset();
        btn.textContent = original;
        btn.disabled = false;
      })
      .catch(err => {
        alert("Error: Ensure your script access is set to 'Anyone'.");
        btn.textContent = original;
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
